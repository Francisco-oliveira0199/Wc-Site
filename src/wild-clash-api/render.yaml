# ✅ Nome CORRETO do arquivo: render.yaml (não .yaml)
# ✅ Deve estar na RAIZ do seu repositório

services:
  - type: web
    name: wildclash-api
    env: node
    plan: free
    region: us  # ✅ Mudar para 'us' que é mais confiável
    rootDir: .  # ✅ Especificar diretório raiz
    buildCommand: |
      echo "🔄 Iniciando build..."
      npm ci  # ✅ Usar npm ci em vez de npm install (mais rápido e confiável)
      echo "✅ Dependências instaladas"
    startCommand: |
      echo "🚀 Iniciando servidor..."
      node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_HOST
        fromDatabase:
          name: wildclash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wildclash-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: wildclash-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wildclash-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: wildclash-db
          property: database
      - key: RATE_LIMIT_WINDOW
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "250"

databases:
  - name: wildclash-db
    plan: free
    region: us
    databaseName: wildclash_db
    user: wildclash_user
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere