services:
  - type: web
    name: wildclash-api
    env: node
    plan: free
    region: ohio
    buildCommand: |
      npm install
      npm run migrate
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_HOST
        fromDatabase:
          name: wildclash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wildclash-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: wildclash-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wildclash-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: wildclash-db
          property: database
      - key: RATE_LIMIT_WINDOW
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "250"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    disk:
      name: logs
      mountPath: /var/log/wildclash
      sizeGB: 1

databases:
  - name: wildclash-db
    plan: free
    region: ohio
    databaseName: wildclash_db
    user: wildclash_user
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    scaling:
      maxConnections: 25
    maintenanceWindow: SUN:03:00-04:00