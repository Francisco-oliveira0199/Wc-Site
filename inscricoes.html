<h2>REGULAMENTO PARA CAMPEONATOS DE WILD RIFT</h2>

<h3>CAPÍTULO 1 – DISPOSIÇÕES GERAIS</h3>
<h4>1.1. Objetivo do Regulamento</h4>
<p>Este documento estabelece todas as regras, procedimentos e responsabilidades para participação nos campeonatos de Wild Rift administrados pela organização, garantindo padronização, equidade competitiva, segurança operacional e respeito entre participantes.</p>

<h4>1.2. Abrangência</h4>
<p>As regras aqui descritas aplicam-se:</p>
<ul>
<li>A todos os jogadores inscritos</li>
<li>Às equipes e representantes oficiais</li>
<li>À equipe organizadora, transmissão, arbitragem e staff</li>
<li>Ao público espectador quando aplicável</li>
</ul>

<h4>1.3. Aceitação das Regras</h4>
<p>A inscrição de uma equipe implica aceitação integral, irrevogável e inquestionável de todas as condições e normas descritas neste regulamento.</p>

<h4>1.4. Princípios do Regulamento</h4>
<p>O torneio segue os princípios:</p>
<ul>
<li>Integridade competitiva</li>
<li>Transparência</li>
<li>Igualdade de condições</li>
<li>Imparcialidade da arbitragem</li>
<li>Conduta profissional</li>
</ul>

<h3>CAPÍTULO 2 – ELEGIBILIDADE E REQUISITOS DOS JOGADORES</h3>
<h4>2.1. Requisitos de Conta</h4>
<p>Para participar, o jogador deve possuir:</p>
<ul>
<li>Conta oficial do Wild Rift</li>
<li>Nome de Invocador adequado e que não infrinja normas da Riot</li>
<li>Conta no servidor designado para o torneio</li>
</ul>

<h4>2.2. Idade Mínima</h4>
<p>O torneio poderá exigir idade mínima definida no regulamento complementar (ex: 13, 16 ou 18 anos).</p>
<p>A organização poderá solicitar comprovação de idade ou autorização de responsáveis.</p>

<h4>2.3. Restrições de Participação</h4>
<p>Jogadores estão impedidos se:</p>
<ul>
<li>Estiverem suspensos pela Riot</li>
<li>Fizerem uso de software não autorizado</li>
<li>Estiverem enquadrados em punições disciplinares da organização</li>
<li>Estiverem inscritos em mais de uma equipe no mesmo campeonato</li>
</ul>

<h4>2.4. Responsabilidade Individual</h4>
<p>Cada jogador é responsável por:</p>
<ul>
<li>Manter sua conexão estável</li>
<li>Possuir dispositivo adequado</li>
<li>Entrar no lobby no horário indicado</li>
<li>Cumprir todas as normas de fair play</li>
</ul>

<h3>CAPÍTULO 3 – FORMAÇÃO E GESTÃO DAS EQUIPES</h3>
<h4>3.1. Composição Mínima e Máxima</h4>
<p>Cada equipe deve registrar:</p>
<ul>
<li>5 jogadores titulares obrigatórios</li>
<li>Até 2 reservas</li>
<li>1 capitão</li>
<li>1 técnico opcional</li>
</ul>

<h4>3.2. Capitão da Equipe</h4>
<p>O capitão é responsável por:</p>
<ul>
<li>Comunicação oficial com a organização</li>
<li>Realizar check-in</li>
<li>Enviar prints de resultados</li>
<li>Reportar problemas e solicitações de pausa</li>
</ul>

<h4>3.3. Responsabilidades do Técnico</h4>
<p>O técnico (quando houver) pode:</p>
<ul>
<li>Participar do draft caso autorizado pelas regras</li>
<li>Auxiliar no preparo da equipe</li>
<li>Participar de reuniões com organizadores</li>
</ul>
<p>O técnico não pode:</p>
<ul>
<li>Entrar na partida em lugar de um jogador titular sem registro prévio como reserva</li>
</ul>

<h4>3.4. Substituições e Alterações de Line-up</h4>
<p>Alterações permitidas:</p>
<ul>
<li>Entre partidas da mesma série</li>
<li>Entre séries diferentes do torneio</li>
</ul>
<p>Alterações proibidas:</p>
<ul>
<li>Durante uma partida iniciada</li>
</ul>
<p>Para que uma substituição seja válida:</p>
<ul>
<li>O jogador deve estar previamente registrado</li>
<li>O capitão deve informar a staff com antecedência mínima estabelecida</li>
</ul>

<h3>CAPÍTULO 4 – CHECK-IN, PRESENÇA E PONTUALIDADE</h3>
<h4>4.1. Procedimentos de Check-in</h4>
<p>O check-in será realizado no canal oficial do Discord e deve ocorrer no período estabelecido pela organização.</p>

<h4>4.2. Atrasos</h4>
<p>Atraso permitido: 10 minutos.</p>
<p>Se excedido:</p>
<ul>
<li>A equipe será declarada perdedora por ausência.</li>
<li>Caso ambas falhem, a organização pode eliminar ambas ou remarcar conforme avaliação.</li>
</ul>

<h4>4.3. Falhas de Comunicação</h4>
<p>Se o capitão não se manifestar no horário limite, a equipe poderá ser considerada ausente.</p>

<h3>CAPÍTULO 5 – CONFIGURAÇÃO DAS PARTIDAS E SISTEMA DE JOGO</h3>
<h4>5.1. Modo de Jogo</h4>
<p>Todas as partidas serão disputadas em:</p>
<ul>
<li>Mapa padrão</li>
<li>Modo Torneio (Draft Competitivo)</li>
</ul>

<h4>5.2. Patch Utilizado</h4>
<p>Será sempre o patch mais recente, salvo instrução contrária.</p>
<p>Atualizações de emergência podem alterar conteúdos e serão consideradas válidas, desde que não inviabilizem o torneio.</p>

<h4>5.3. Definição de Lado (Azul/Vermelho)</h4>
<p>Pode ser definida por:</p>
<ul>
<li>Seed</li>
<li>Sorteio</li>
<li>Preferência do time melhor colocado</li>
<li>Alternância em séries md3/md5</li>
</ul>

<h4>5.4. Recriação de Partida</h4>
<p>A partida deverá ser reiniciada se:</p>
<ul>
<li>O lobby apresentar falhas</li>
<li>Houver problemas no draft</li>
<li>Jogadores caírem antes da fase de rotas sem ação tomada</li>
</ul>

<h3>CAPÍTULO 6 – REGRAS DO DRAFT</h3>
<h4>6.1. Estrutura</h4>
<p>Seguirá o formato oficial:</p>
<ul>
<li>3 bans por equipe</li>
<li>Seleção alternada de campeões (pick)</li>
<li>Ordem estabelecida pelo sistema</li>
</ul>

<h4>6.2. Proibições de Campeões</h4>
<p>Em caso de campeões desabilitados:</p>
<ul>
<li>Eles estarão automaticamente proibidos</li>
<li>Caso selecionados por erro do sistema, deve haver remake imediato</li>
</ul>

<h4>6.3. Erros de Draft</h4>
<p>Se houver:</p>
<ul>
<li>Escolhas incorretas</li>
<li>Bans fora da ordem</li>
<li>Problemas no lobby</li>
</ul>
<p>A partida deve ser reaberta e o draft replicado.</p>

<h3>CAPÍTULO 7 – PAUSAS, DESCONEXÕES E PROBLEMAS TÉCNICOS</h3>
<h4>7.1. Tipos de Pausa Permitidos</h4>
<p>Pausas podem ser solicitadas apenas por:</p>
<ul>
<li>Problemas técnicos significativos</li>
<li>Quedas de jogadores</li>
<li>Bugs críticos (comprovados e relevantes)</li>
</ul>

<h4>7.2. Limite de Pausas</h4>
<p>Cada equipe possui:</p>
<ul>
<li>10 minutos totais de pausa por série</li>
<li>Após esse limite, a equipe deve continuar a partida independentemente da condição.</li>
</ul>

<h4>7.3. Situações que Não Justificam Pausa</h4>
<ul>
<li>Notificações ou mensagens externas</li>
<li>Problemas com acessórios não essenciais</li>
<li>Baixo desempenho do dispositivo por falha de manutenção</li>
</ul>

<h4>7.4. Retomada da Partida</h4>
<p>Assim que o problema for resolvido, a equipe deve informar e a partida deverá ser retomada de forma imediata.</p>

<h3>CAPÍTULO 8 – CONDUTA, ÉTICA E FAIR PLAY</h3>
<h4>8.1. Proibições Gerais</h4>
<p>É proibido:</p>
<ul>
<li>Ofensas, insultos, ameaças ou provocações</li>
<li>Toxicidade em partida ou canais de comunicação</li>
<li>Uso de cheats, hacks, scripts ou macros</li>
<li>Aproveitamento intencional de bugs</li>
<li>Ghosting (assistir transmissão ao vivo da partida)</li>
<li>Compartilhar contas</li>
</ul>

<h4>8.2. Conduta Profissional</h4>
<p>Cada jogador deve manter postura respeitosa com:</p>
<ul>
<li>Adversários</li>
<li>Staff</li>
<li>Público</li>
<li>Teammates</li>
</ul>

<h4>8.3. Assédio e Discriminação</h4>
<p>A tolerância é zero para:</p>
<ul>
<li>Racismo</li>
<li>Xenofobia</li>
<li>Homofobia</li>
<li>Sexismo</li>
<li>Ameaças</li>
</ul>
<p>Qualquer infração pode resultar em banimento imediato.</p>

<h3>CAPÍTULO 9 – REGISTRO DE RESULTADOS</h3>
<h4>9.1. Obrigatoriedade da Comprovação</h4>
<p>O capitão da equipe vencedora deve enviar:</p>
<ul>
<li>Print da tela de vitória</li>
<li>Print da tabela final da partida</li>
</ul>

<h4>9.2. Divergências</h4>
<p>Em caso de contestação:</p>
<ul>
<li>Ambas as equipes devem enviar suas capturas</li>
<li>A organização decidirá analisando todos os dados disponíveis</li>
</ul>

<h4>9.3. Falta de Evidências</h4>
<p>A ausência das evidências pode invalidar o resultado.</p>

<h3>CAPÍTULO 10 – TRANSMISSÃO, DIREITOS DE IMAGEM E STREAMS PESSOAIS</h3>
<h4>10.1. Transmissão Oficial</h4>
<p>A organização poderá transmitir:</p>
<ul>
<li>Partidas selecionadas</li>
<li>Série completa ou parcial</li>
<li>Entrevistas, análises e conteúdos extras</li>
</ul>

<h4>10.2. Streams dos Jogadores</h4>
<p>Jogadores só podem transmitir se:</p>
<ul>
<li>A organização permitir</li>
<li>Um delay mínimo for aplicado</li>
<li>Não interferir no andamento da equipe</li>
</ul>

<h4>10.3. Uso de Imagem</h4>
<p>Ao participar do torneio, o jogador autoriza o uso de:</p>
<ul>
<li>Nickname</li>
<li>Voz em entrevistas</li>
<li>Clips de jogadas</li>
<li>Material gerado no evento</li>
</ul>

<h3>CAPÍTULO 11 – PUNIÇÕES E SANÇÕES DISCIPLINARES</h3>
<h4>11.1. Tipos de Penalidades</h4>
<p>A organização poderá aplicar:</p>
<ul>
<li>Advertência</li>
<li>Perda de side</li>
<li>Perda de champion pick</li>
<li>Perda de mapa</li>
<li>Perda de série</li>
<li>Desclassificação</li>
<li>Suspensão temporária</li>
<li>Banimento permanente</li>
</ul>

<h4>11.2. Critérios para Penalidades</h4>
<p>Serão considerados:</p>
<ul>
<li>Gravidade da infração</li>
<li>Reincidência</li>
<li>Intenção do ato</li>
<li>Impacto competitivo</li>
</ul>

<h4>11.3. Infrações Graves</h4>
<p>Puníveis com desclassificação imediata:</p>
<ul>
<li>Uso de hack</li>
<li>Ameaças ou ataques pessoais</li>
<li>Racismo e outras formas de ódio</li>
<li>Manipulação de resultados</li>
</ul>

<h3>CAPÍTULO 12 – DECISÕES DA ORGANIZAÇÃO E CASOS OMISSOS</h3>
<h4>12.1. Poder Decisório</h4>
<p>As decisões da organização são definitivas e não cabem recursos.</p>

<h4>12.2. Casos Não Previstos</h4>
<p>Situações não contempladas neste regulamento serão analisadas pela administração e decididas conforme critérios de justiça, integridade competitiva e precedentes.</p>

<h4>12.3. Atualizações do Regulamento</h4>
<p>A organização pode atualizar este regulamento antes ou durante o campeonato, desde que comunique imediatamente as equipes.</p>
